name: ChatGPT p7zip Bootstrap

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install and package 7-Zip
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full 7zip
          mkdir -p bundle
          for cmd in 7zz 7z 7za; do
            path="$(command -v "$cmd" || true)"
            if [ -n "$path" ]; then
              cp -L "$path" "bundle/$cmd"
            fi
          done
          ls -lah bundle
          file bundle/*
          tar -C bundle -czf p7zip-linux-x64.tar.gz .
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: p7zip-linux-x64
          path: p7zip-linux-x64.tar.gz
          retention-days: 1
