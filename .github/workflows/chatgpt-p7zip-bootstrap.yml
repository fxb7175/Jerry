name: ChatGPT p7zip Bootstrap

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install and package 7-Zip
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full 7zip
          mkdir -p bundle/bin bundle/lib
          cp -a /usr/bin/7z /usr/bin/7za bundle/bin/
          cp -a /usr/lib/7zip bundle/lib/
          find bundle -maxdepth 3 -type f -exec ls -lh {} \;
          tar -C bundle -czf p7zip-linux-x64.tar.gz .
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: p7zip-linux-x64
          path: p7zip-linux-x64.tar.gz
          retention-days: 1
